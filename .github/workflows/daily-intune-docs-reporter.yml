name: Daily Intune & Entra Docs Reporter

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest

    env:
      TZ_REPORT: Europe/Amsterdam
      LOOKBACK_HOURS: "24"
      OUTPUT_DIR: out

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Generate and publish report
        run: node report.mjs --publish
        working-directory: tools/daily-intune-docs-reporter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-intune-docs-report
          path: |
            tools/daily-intune-docs-reporter/out/report.html
            tools/daily-intune-docs-reporter/out/report.md
            tools/daily-intune-docs-reporter/out/report.json

      - name: Publish report as Jekyll post
        run: |
          REPORT_DATE=$(date -u -d '-1 day' +'%Y-%m-%d')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CHANGES=0

          # Docs changes post
          DOCS_FILE="site/_posts/${REPORT_DATE}-daily-report.md"
          DOCS_MD="tools/daily-intune-docs-reporter/out/report-docs.md"
          if [ ! -f "$DOCS_FILE" ] && [ -f "$DOCS_MD" ]; then
            if ! grep -q "No new items" "$DOCS_MD"; then
              {
                echo "---"
                echo 'title: "Daily Intune & Entra Report"'
                echo "date: ${REPORT_DATE}"
                echo "category: report"
                echo "---"
                echo ""
                tail -n +5 "$DOCS_MD"
              } > "$DOCS_FILE"
              git add "$DOCS_FILE"
              CHANGES=1
            fi
          fi

          # Roadmap post
          ROADMAP_FILE="site/_posts/${REPORT_DATE}-roadmap.md"
          ROADMAP_MD="tools/daily-intune-docs-reporter/out/report-roadmap.md"
          if [ ! -f "$ROADMAP_FILE" ] && [ -f "$ROADMAP_MD" ]; then
            # Only create if there are actual roadmap items (not just "No new items")
            if ! grep -q "No new items" "$ROADMAP_MD"; then
              {
                echo "---"
                echo 'title: "M365 Roadmap Update"'
                echo "date: ${REPORT_DATE}"
                echo "category: roadmap"
                echo "---"
                echo ""
                tail -n +5 "$ROADMAP_MD"
              } > "$ROADMAP_FILE"
              git add "$ROADMAP_FILE"
              CHANGES=1
            fi
          fi

          if [ "$CHANGES" = "1" ]; then
            git commit -m "Add daily report for ${REPORT_DATE}"
            git push
          else
            echo "No new posts to commit."
          fi
