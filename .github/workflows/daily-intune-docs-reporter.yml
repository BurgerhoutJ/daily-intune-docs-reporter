name: Daily Intune & Entra Docs Reporter

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest

    env:
      TZ_REPORT: Europe/Amsterdam
      LOOKBACK_HOURS: "24"
      OUTPUT_DIR: out

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Generate and publish report
        run: node report.mjs --publish
        working-directory: tools/daily-intune-docs-reporter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-intune-docs-report
          path: |
            tools/daily-intune-docs-reporter/out/report.html
            tools/daily-intune-docs-reporter/out/report.md
            tools/daily-intune-docs-reporter/out/report.json

      - name: Publish report as Jekyll post
        run: |
          REPORT_DATE=$(date -u -d '-1 day' +'%Y-%m-%d')
          POST_FILE="site/_posts/${REPORT_DATE}-daily-report.md"

          if [ -f "$POST_FILE" ]; then
            echo "Post $POST_FILE already exists, skipping."
            exit 0
          fi

          REPORT_MD="tools/daily-intune-docs-reporter/out/report.md"
          if [ ! -f "$REPORT_MD" ]; then
            echo "No report markdown found, skipping."
            exit 0
          fi

          # Extract the title from the first heading
          TITLE=$(head -1 "$REPORT_MD" | sed 's/^# //')

          # Build the Jekyll post: front matter + body (skip the first heading line)
          {
            echo "---"
            echo "title: \"${TITLE}\""
            echo "date: ${REPORT_DATE}"
            echo "---"
            echo ""
            tail -n +3 "$REPORT_MD"
          } > "$POST_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$POST_FILE"
          git commit -m "Add daily report for ${REPORT_DATE}"
          git push
