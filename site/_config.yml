title: Daily Intune & Entra Docs Reporter
description: Daily digest of changes to Microsoft's Intune, Windows Autopilot, and Entra documentation.
url: "https://reporter.burgerhout.org"
baseurl: ""

github_repo: BurgerhoutJ/daily-intune-docs-reporter
future: true

permalink: /:year/:month/:day/

exclude:
  - Gemfile
  - .gitkeep

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
