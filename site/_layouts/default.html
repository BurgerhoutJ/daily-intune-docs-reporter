<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HQRXERQGNZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HQRXERQGNZ');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="site-brand">
        <img src="{{ '/assets/avatar.png' | relative_url }}" alt="Jeroen Burgerhout" class="site-avatar">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      </div>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
        <span class="visually-hidden">Toggle navigation menu</span>
        <span class="nav-toggle-icon" aria-hidden="true">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </span>
      </button>
      <nav class="site-nav" id="site-navigation" aria-label="Primary">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/roadmap' | relative_url }}" {% if page.url == '/roadmap' %}class="active"{% endif %}>Roadmap</a>
        <a href="{{ '/archive' | relative_url }}" {% if page.url == '/archive' %}class="active"{% endif %}>Archive</a>
        <a href="https://github.com/{{ site.github_repo }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-author">
        <img src="{{ '/assets/author.png' | relative_url }}" alt="Jeroen Burgerhout" class="footer-avatar">
        <div>
          <strong>Jeroen Burgerhout ☁️ | MVP</strong>
          <span>Microsoft Intune MVP | MCT | CEO (Chief Everything Officer)</span>
        </div>
      </div>
      <div class="footer-links">
        <a href="https://www.burgerhout.org" target="_blank" rel="noopener noreferrer">Blog</a>
        <a href="https://www.linkedin.com/in/jeroenburgerhout/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://bsky.app/profile/jeroen.burgerhout.org" target="_blank" rel="noopener noreferrer">Bluesky</a>
        <a href="https://youtube.com/@BurgerhoutJ" target="_blank" rel="noopener noreferrer">YouTube</a>
        <a href="https://github.com/{{ site.github_repo }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
      <p class="footer-note">Reports generated daily at 06:00 UTC from Microsoft's documentation repositories.</p>
    </div>
  </footer>

  <script>
  // Open all external links in new tab
  document.querySelectorAll('.report-content a, .report-items a').forEach(a => {
    if (a.hostname && a.hostname !== location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });

  const navToggle = document.querySelector('.nav-toggle');
  const siteNav = document.querySelector('#site-navigation');
  const mobileNav = window.matchMedia('(max-width: 768px)');

  if (navToggle && siteNav) {
    const setMenuState = isOpen => {
      document.body.classList.toggle('nav-open', isOpen);
      navToggle.setAttribute('aria-expanded', String(isOpen));
      siteNav.setAttribute('aria-hidden', String(mobileNav.matches && !isOpen));
      siteNav.inert = mobileNav.matches && !isOpen;
    };

    const syncMenuState = () => {
      if (!mobileNav.matches) {
        setMenuState(false);
        siteNav.removeAttribute('aria-hidden');
        siteNav.inert = false;
        return;
      }

      setMenuState(document.body.classList.contains('nav-open'));
    };

    navToggle.addEventListener('click', () => {
      setMenuState(!document.body.classList.contains('nav-open'));
    });

    siteNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        if (mobileNav.matches) setMenuState(false);
      });
    });

    document.addEventListener('click', event => {
      if (!mobileNav.matches || !document.body.classList.contains('nav-open')) return;
      if (!siteNav.contains(event.target) && !navToggle.contains(event.target)) setMenuState(false);
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.body.classList.contains('nav-open')) {
        setMenuState(false);
        navToggle.focus();
      }
    });

    if (typeof mobileNav.addEventListener === 'function') {
      mobileNav.addEventListener('change', syncMenuState);
    } else if (typeof mobileNav.addListener === 'function') {
      mobileNav.addListener(syncMenuState);
    }

    syncMenuState();
  }
  </script>
</body>
</html>
