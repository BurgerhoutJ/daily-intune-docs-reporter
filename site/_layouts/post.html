---
layout: default
---

<article class="report-card report-full">
  <div class="card-header">
    <h1 class="card-title">{{ page.title }}</h1>
    <span class="card-date">{{ page.date | date: "%d %b %Y" }}</span>
  </div>
  <div class="report-content">
    {{ content }}
  </div>
  <div class="post-nav">
    {% if page.previous.url %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>{% endif %}
    {% if page.next.url %}<a href="{{ page.next.url | relative_url }}" class="next">{{ page.next.title }} &rarr;</a>{% endif %}
  </div>
</article>
